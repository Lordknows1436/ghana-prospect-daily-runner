name: Daily Greater Accra discovery (no AI)
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-greater-accra-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out collector and encrypted state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Collect, check and encrypt public business research
        run: node runner.mjs
        env:
          FEED_KEY: ${{ secrets.FEED_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
