name: Daily Greater Accra discovery (no AI)
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      retry_unavailable:
        description: Retry a day with zero successful sources (once only)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-greater-accra-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out collector and encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Collect, check and encrypt public business research
        run: node runner.mjs
        env:
          FEED_KEY: ${{ secrets.FEED_KEY }}
          NEXTGIS_OVERPASS_API_KEY: ${{ secrets.NEXTGIS_OVERPASS_API_KEY }}
          RETRY_UNAVAILABLE: ${{ inputs.retry_unavailable }}
          GITHUB_TOKEN: ${{ github.token }}
